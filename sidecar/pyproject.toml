[project]
name = "cognito-sidecar"
version = "0.1.0"
description = "Cognito ingestion and hybrid query sidecar"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "pymupdf>=1.27.2.2",
  "python-docx>=1.1",
  "sqlite-vec>=0.1.9",
  "torch",
  "transformers>=4.51",
  "sentence-transformers>=3.0",
  "huggingface_hub",
  "gliner",
  "protobuf>=4",
  "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
ocr = ["ocrmac>=1.0; sys_platform == 'darwin'"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Scripts and main put the package root on sys.path before local imports.
per-file-ignores = { "main.py" = ["E402"], "scripts/*.py" = ["E402"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
