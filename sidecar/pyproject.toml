[project]
name = "cognito-sidecar"
version = "0.1.0"
description = "Cognito ingestion and hybrid query sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "duckdb>=1.0",
  "pymupdf>=1.27.2.2",
  "sqlite-vec>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
