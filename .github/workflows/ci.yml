# CI: PR and main — lint, tests, compile (no full OS-specific bundle on Ubuntu).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v4
      # Tauri / gtk-rs need GLib/GTK + WebKit dev packages on Linux (same family as tauri-smoke).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      # tauri.conf.json bundles resources/sidecar; that path is gitignored — package-sidecar creates it.
      # package:sidecar installs a standalone CPython into resources/; cargo --include-ignored
      # still uses the repo sidecar/.venv (see ingest integration test ignore reason).
      - run: npm ci
      - run: npm run package:sidecar
      - working-directory: sidecar
        run: uv sync
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test -- --include-ignored
      - working-directory: src-tauri
        run: cargo build --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - working-directory: sidecar
        run: uv sync --extra dev
      - working-directory: sidecar
        run: uv run ruff check
      - working-directory: sidecar
        run: uv run ruff format --check
      - working-directory: sidecar
        run: uv run pytest

  tauri-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - run: npm run package:sidecar
      - name: Bundled Python imports with empty environment
        run: |
          env -i src-tauri/resources/sidecar/python/bin/python3 -c "import fitz, sqlite_vec, httpx, numpy, rapidfuzz, docx, transformers"
      - name: Bundled sidecar ping with empty environment
        working-directory: src-tauri/resources/sidecar
        run: |
          reply=$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping","params":{}}' | env -i ./python/bin/python3 ./main.py)
          echo "$reply"
          echo "$reply" | grep -q pong
      - name: Link release binary (validates Tauri + bundled sidecar layout)
        working-directory: src-tauri
        run: cargo build --release
